[project]
name = "validation-service"
version = "0.1.0"
description = "Wraps naive_first_engine as a REST service: runs the leakage-aware validation protocol against a dataset via POST /runs, persists per-split results, emits run.completed."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    # VS-023/024: IngestionServiceDatasetSource (src/app/dataset_source.py)
    # calls ingestion-service over HTTP at runtime -- httpx was previously
    # only a [dependency-groups] dev entry (test TestClient usage), which
    # worked in every test run but left it absent from the production image
    # (Dockerfile's `uv sync --frozen --no-dev`), crash-looping the
    # container on startup (found live during Sprint 18 UAT, 2026-08-26).
    "httpx>=0.27",
    "naive_first_engine",
    "naive_first_common",
]

[tool.uv.sources]
naive_first_engine = { path = "../../libs/naive_first_engine", editable = true }
naive_first_common = { path = "../../libs/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
    "naive_first_common",
    "pytest-cov>=7.1.0",
]
