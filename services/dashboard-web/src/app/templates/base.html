<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}dashboard-web{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1>Naive-First -- validation/audit dashboard</h1>
            {% if request.cookies.get('session_id') %}
            <nav class="main-nav">
                <a href="/runs/new" class="{{ 'active' if request.url.path == '/runs/new' else '' }}">Submit a run</a>
                <a href="/runs" class="{{ 'active' if request.url.path == '/runs' or (request.url.path.startswith('/runs/') and request.url.path != '/runs/new') else '' }}">Runs</a>
                <a href="/datasets" class="{{ 'active' if request.url.path == '/datasets' else '' }}">Datasets</a>
                <form method="post" action="/logout" class="logout-form">
                    <button type="submit" class="nav-logout">Log out</button>
                </form>
            </nav>
            {% endif %}
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
