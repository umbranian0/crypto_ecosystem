{% extends "base.html" %}
{% block title %}First-run setup -- dashboard-web{% endblock %}
{% block content %}
<h2>First-run setup</h2>
<p>Create your tenant to get started. You will receive an API key for validation runs -- shown once.</p>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post" action="/setup">
    <label for="tenant_name">Tenant name</label>
    <input type="text" id="tenant_name" name="tenant_name" required>
    <button type="submit">Create tenant</button>
</form>
{% endblock %}
