[project]
name = "dashboard-web"
version = "0.1.0"
description = "Server-rendered UI (FastAPI + Jinja2/HTMX) for a tenant to log in with a gateway-api API key, submit a validation run, and view its status and per-split results. Owns no data access -- every page is rendered from calls to gateway-api's public contract, the same as an external client would use."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "naive_first_common",
]

[tool.uv.sources]
naive_first_common = { path = "../../libs/common", editable = true }
naive_first_engine = { path = "../../libs/naive_first_engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not e2e\""
markers = [
    "e2e: Selenium browser-level end-to-end tests (DASH-009) -- require a real running dashboard-web instance plus a driver/browser; excluded from the default `uv run pytest` unit run, run explicitly via `uv run pytest -m e2e`.",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
    "naive_first_common",
    "naive_first_engine",
    "pytest-cov>=7.1.0",
    "selenium>=4.20",
]
