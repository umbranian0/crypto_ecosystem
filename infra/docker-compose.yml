services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: naive-first-postgres
    restart: unless-stopped
    ports:
      # Bound to localhost only (operability finding, 2026-08-09 review):
      # only validation-service/gateway-api need to reach Postgres, both via
      # the internal Compose network, not the host's public interface.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naive_first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naive_first_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-naive_first}
      # Consumed by postgres-init/02-create-app-role.sh (INF-014, fresh-volume
      # boots only) to create the non-superuser runtime role -- not read by
      # the official image's own entrypoint the way POSTGRES_USER/PASSWORD are.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-naive_first_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-naive_first_app_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naive_first} -d ${POSTGRES_DB:-naive_first}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis
    container_name: naive-first-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Bound to localhost only (operability finding, 2026-08-09 review) --
      # same rationale as postgres above.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 5s
      retries: 10

  validation-service:
    build:
      context: ../services/validation-service
      additional_contexts:
        libs: ../libs
    container_name: naive-first-validation-service
    restart: unless-stopped
    ports:
      # Bound to localhost only, not the host's public interface (ARCH-005 /
      # 2026-08-09 review): CLAUDE.md/implementation-plan.md's "gateway-api
      # is the only internet-facing service" boundary. This does not replace
      # LC-009's cryptographic tenant-header verification -- ARCH-005 is
      # still open -- but it is the cheap, already-actionable half of that
      # ticket's own acceptance criteria (network-topology requirement).
      - "127.0.0.1:${VALIDATION_SERVICE_PORT:-8001}:8000"
    environment:
      # DATABASE_URL points at the `validation` schema's parent database via
      # the internal Compose network hostname, using the non-superuser
      # runtime role naive_first_app (INF-014) -- naive_first stays
      # migration-only so Postgres RLS (FORCE ROW LEVEL SECURITY) is actually
      # enforced against this connection (superusers/BYPASSRLS roles bypass
      # RLS unconditionally).
      DATABASE_URL: ${VALIDATION_SERVICE_DATABASE_URL:-postgresql://${POSTGRES_APP_USER:-naive_first_app}:${POSTGRES_APP_PASSWORD:-naive_first_app_dev_password}@postgres:5432/${POSTGRES_DB:-naive_first}}
      REDIS_URL: ${VALIDATION_SERVICE_REDIS_URL:-redis://redis:6379/0}
      # VS-024's IngestionServiceDatasetSource defaults to localhost:8003,
      # which inside this container resolves to validation-service's own
      # container, not the sibling ingestion-service one -- same class of
      # gap as gateway-api's REPORTING_SERVICE_URL/INGESTION_SERVICE_URL fix
      # above (found live during Sprint 18 UAT, 2026-08-26).
      INGESTION_SERVICE_URL: ${VALIDATION_SERVICE_INGESTION_SERVICE_URL:-http://ingestion-service:8003}
    depends_on:
      postgres:
        condition: service_healthy
      # redis dependency deferred: VS-014 (Redis Streams publisher) has not
      # landed yet, so validation-service doesn't talk to Redis at runtime.

  gateway-api:
    build:
      context: ../services/gateway-api
      additional_contexts:
        libs: ../libs
    container_name: naive-first-gateway-api
    restart: unless-stopped
    ports:
      - "${GATEWAY_API_PORT:-8000}:8000"
    environment:
      # Internal Compose network hostname -- gateway-api's own README
      # documents a `localhost` default for non-Compose dev; this override
      # points it at validation-service's Compose service name instead.
      VALIDATION_SERVICE_URL: ${GATEWAY_API_VALIDATION_SERVICE_URL:-http://validation-service:8000}
      # Same rationale as VALIDATION_SERVICE_URL above -- http_client.py's
      # own default (http://localhost:8002/8003) resolves to gateway-api's
      # own container inside the Compose network, not the sibling service,
      # so both must be overridden here or every reporting-service/
      # ingestion-service proxy route 502s with "downstream service
      # unavailable" despite both services being healthy (found live during
      # Sprint 18 UAT, 2026-08-26).
      REPORTING_SERVICE_URL: ${GATEWAY_API_REPORTING_SERVICE_URL:-http://reporting-service:8002}
      INGESTION_SERVICE_URL: ${GATEWAY_API_INGESTION_SERVICE_URL:-http://ingestion-service:8003}
      # GW-021's shared operator-token stopgap -- must be explicitly passed
      # through here or operator_auth.py's os.environ.get returns None and
      # every operator-gated route 401s regardless of the token presented
      # (same live-UAT finding as above).
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-naive_first_operator_dev_token}
      # GATEWAY_API_DOWNSTREAM_TIMEOUT_SECONDS: found via live E2E QA
      # (2026-09-01, post-INGEST-013) that the http_client.py default of 30s
      # is too short for a full first-crawl backfill proxied through this
      # service -- INGEST-013's much-deeper verified default backfill start
      # dates (Binance 2017-08-17, blockchain.info 2009-01-03) mean a
      # tenant's first Binance crawl alone took ~70s of real, successful
      # downstream work (79k rows fetched+inserted) despite completing fine
      # server-side; the caller only ever saw a 504 and had no way to know
      # the crawl actually succeeded in the background. Raised to 240s so a
      # normal first-crawl backfill has room to complete before the proxy
      # gives up on it. This does not fix the underlying "long-running
      # synchronous crawl behind a synchronous HTTP proxy" architecture --
      # see this session's QA-sweep notes for a flagged follow-up (async
      # crawl-job tracking, and a related crawl-concurrency race) not
      # resolved here.
      GATEWAY_API_DOWNSTREAM_TIMEOUT_SECONDS: ${GATEWAY_API_DOWNSTREAM_TIMEOUT_SECONDS:-240}
      # DATABASE_URL points at the `identity` schema's parent database via
      # the internal Compose network hostname, using the non-superuser
      # runtime role naive_first_app (INF-014) -- same rationale as
      # validation-service above: naive_first stays migration-only so RLS is
      # actually enforced against the running app's connection.
      DATABASE_URL: ${GATEWAY_API_DATABASE_URL:-postgresql://${POSTGRES_APP_USER:-naive_first_app}:${POSTGRES_APP_PASSWORD:-naive_first_app_dev_password}@postgres:5432/${POSTGRES_DB:-naive_first}}
    depends_on:
      postgres:
        condition: service_healthy
      # validation-service is not a depends_on: gateway-api's own downstream
      # HTTP calls (GW-009) already handle validation-service being
      # unreachable (502/504), so this doesn't need a hard startup ordering.

  reporting-service:
    build:
      context: ../services/reporting-service
      additional_contexts:
        libs: ../libs
    container_name: naive-first-reporting-service
    restart: unless-stopped
    ports:
      # Bound to localhost only, same rationale as validation-service above
      # (ARCH-005 / "gateway-api is the only internet-facing service"):
      # GW-018 (separate ticket) is what makes this reachable from outside
      # the Docker network, via a gateway-api proxy route, not a public port
      # binding here.
      - "127.0.0.1:${REPORTING_SERVICE_PORT:-8002}:8002"
    environment:
      # DATABASE_URL points at the `reporting` schema's parent database via
      # the internal Compose network hostname, using the non-superuser
      # runtime role naive_first_app (INF-014) -- same rationale as
      # validation-service/gateway-api above: naive_first stays
      # migration-only so Postgres RLS is actually enforced against the
      # running app's connection.
      DATABASE_URL: ${REPORTING_SERVICE_DATABASE_URL:-postgresql://${POSTGRES_APP_USER:-naive_first_app}:${POSTGRES_APP_PASSWORD:-naive_first_app_dev_password}@postgres:5432/${POSTGRES_DB:-naive_first}}
      REDIS_URL: ${REPORTING_SERVICE_REDIS_URL:-redis://redis:6379/0}
      # Internal Compose network hostname -- reporting-service calls
      # validation-service's GET /runs/{id}/GET /runs/{id}/splits directly by
      # hostname inside the Docker network (see reporting-service's own
      # README), never through gateway-api.
      VALIDATION_SERVICE_URL: ${REPORTING_SERVICE_VALIDATION_SERVICE_URL:-http://validation-service:8000}
    depends_on:
      postgres:
        condition: service_healthy
      # Unlike validation-service, reporting-service DOES depend on redis at
      # startup readiness: RS-006's future Redis Streams subscriber needs
      # Redis available (even though nothing consumes REDIS_URL yet, same
      # "wired through but not yet consumed" situation validation-service's
      # own REDIS_URL was in before VS-014 landed).
      redis:
        condition: service_healthy

  ingestion-service:
    build:
      context: ../services/ingestion-service
      additional_contexts:
        libs: ../libs
    container_name: naive-first-ingestion-service
    restart: unless-stopped
    ports:
      # Bound to localhost only, same rationale as validation-service/
      # reporting-service above (ARCH-005 / "gateway-api is the only
      # internet-facing service"): this is a disclosed override of trigger
      # #6 (see ../services/ingestion-service/README.md's status line) --
      # not yet reachable from outside the Docker network. Port 8003, not
      # the next free number after reporting-service's 8002: GW-021 already
      # committed to 8003 as this service's own port (gateway-api's
      # dependencies/http_client.py's INGESTION_SERVICE_URL default and
      # infra/.env.example's own INGESTION_SERVICE_URL entry, both landed
      # before this ticket) -- matching that existing wiring here, not
      # picking a fresh number, so GW-021's proxy route resolves correctly
      # by default.
      - "127.0.0.1:${INGESTION_SERVICE_PORT:-8003}:8003"
    environment:
      # DATABASE_URL points at the `ingestion` schema's parent database via
      # the internal Compose network hostname, using the non-superuser
      # runtime role naive_first_app (INF-014) -- same rationale as
      # validation-service/gateway-api/reporting-service above: naive_first
      # stays migration-only so Postgres RLS is actually enforced against
      # the running app's connection.
      DATABASE_URL: ${INGESTION_SERVICE_DATABASE_URL:-postgresql://${POSTGRES_APP_USER:-naive_first_app}:${POSTGRES_APP_PASSWORD:-naive_first_app_dev_password}@postgres:5432/${POSTGRES_DB:-naive_first}}
      # INGEST-011's credential_crypto.py Fernet key -- referenced via env
      # var, same "insecure dev-only default, override for anything beyond
      # local dev" convention as POSTGRES_APP_PASSWORD/MINIO_ROOT_PASSWORD
      # above; see infra/.env.example for how to generate a real one.
      INGESTION_CREDENTIAL_ENCRYPTION_KEY: ${INGESTION_CREDENTIAL_ENCRYPTION_KEY:-KzEyHIA7xvThTmsJXBWZZej0qD4GMjl8tMV76KJXpAo=}
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio
    container_name: naive-first-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      # Bound to localhost only, same rationale as postgres/redis above
      # (operability finding, 2026-08-09 review): no service reads or writes
      # to this container yet -- ingestion-service (trigger #6) is the first
      # real consumer and hasn't been built yet -- so there's no need to
      # expose it beyond the host.
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-naive_first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-naive_first_dev_password}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
