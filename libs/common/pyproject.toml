[project]
name = "naive_first_common"
version = "0.1.0"
description = "Shared cross-cutting concerns for Naive-First platform services: tenant context, DB session/engine helpers, and (later) cross-service schemas/formatting logic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naive_first_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "fastapi>=0.110",
    "httpx>=0.27",
]
