[project]
name = "naive_first_engine"
version = "0.1.0"
description = "Leakage-aware walk-forward validation protocol: rolling-origin splitting, naive baselines, metrics, and Diebold-Mariano testing. Pure Python + pandas/numpy/scipy only - no web, DB, or orchestration dependencies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naive_first_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=7.4",
]
