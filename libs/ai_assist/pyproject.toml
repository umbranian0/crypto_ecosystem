[project]
name = "naive_first_ai_assist"
version = "0.1.0"
description = "Shared hosted-AI-model client Adapter for Naive-First platform services (AI-003-REFACTOR): a hosted, OpenAI-compatible chat-completions HTTPS client, extracted from reporting-service's AI-002 narrative client once dashboard-web's AI-003 needed the same generate(prompt) -> str contract."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naive_first_ai_assist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=7.4",
]
